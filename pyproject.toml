[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hh-goa-voice-rag"
version = "0.1.0"
description = "Voice-enabled, multilingual RAG over AI4Bharat MSMARCO-XI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
data = ["datasets>=2.19"]
quality = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
voice-rag = "voice_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
